<ng-container *ngIf="expediente">
  <app-ver-caso-integridad
    *ngIf="esIntegridad; else casoQrd"
    [denuncia]="expediente"
    [soloLectura]="true"
    [editorInspectoria]="editarInspectoria ? editor : null"
    (cerrar)="cerrar.emit()"
  ></app-ver-caso-integridad>

  <ng-template #casoQrd>
    <app-ver-caso-listado-qrd
      [expediente]="expediente"
      [modoGestion]="false"
      [soloLectura]="true"
    [editorInspectoria]="editarInspectoria ? editor : null"
      (cerrar)="cerrar.emit()"
    ></app-ver-caso-listado-qrd>
  </ng-template>
</ng-container>

<ng-template #editor let-campo>
  <select class="insp-select" [attr.aria-label]="etiquetasInspectoria[campo]"
    [ngModel]="valores[campo]" (ngModelChange)="cambiar(campo, $event)"
    [disabled]="cargando || guardando || !!error">
    <option value="">Seleccione</option>
    <option *ngFor="let opcion of opciones[campo]" [value]="opcion.id">{{ opcion.nombre }}</option>
  </select>
  <div *ngIf="campo === 'idIg'">
    <p *ngIf="error" role="alert">{{ error }}</p>
    <button *ngIf="error" type="button" class="insp-guardar" (click)="cargarOpciones()" [disabled]="cargando">Reintentar</button>
    <button type="button" class="insp-guardar" (click)="guardarInspectoria()" [disabled]="cargando || guardando || !!error">
      {{ guardando ? 'Guardando…' : 'Guardar inspectoría' }}
    </button>
  </div>
</ng-template>
