<div class="nuevo-documento-page">
  <section class="persona-seccion">
    <button
      type="button"
      class="persona-toggle"
      [attr.aria-expanded]="mostrarDatosPersona"
      [disabled]="guardando"
      (click)="mostrarDatosPersona = !mostrarDatosPersona"
    >
      <span>
        <strong>DATOS DE LA PERSONA</strong>
        <small>Opcional</small>
      </span>

      <span aria-hidden="true">
        {{ mostrarDatosPersona ? "−" : "+" }}
      </span>
    </button>

    <div class="persona-contenido" [hidden]="!mostrarDatosPersona">

      <fieldset class="persona-grid" [disabled]="guardando">
        <legend class="persona-sr">Datos opcionales de la persona</legend>

        <label class="campo persona-nombres">
          <span class="persona-label">NOMBRES</span>
          <input
            type="text"
            name="personaNombres"
            [(ngModel)]="datosPersona.nombres"
            maxlength="100"
            autocomplete="given-name"
            placeholder="Ingrese los nombres"
          />
        </label>

        <label class="campo persona-apellidos">
          <span class="persona-label">APELLIDOS</span>
          <input
            type="text"
            name="personaApellidos"
            [(ngModel)]="datosPersona.apellidos"
            maxlength="150"
            autocomplete="family-name"
            placeholder="Ingrese los apellidos"
          />
        </label>

        <label class="campo persona-ruc">
          <span class="persona-label">RUC</span>
          <input
            type="text"
            name="personaRuc"
            [(ngModel)]="datosPersona.ruc"
            maxlength="11"
            inputmode="numeric"
            placeholder="Ingrese 11 dígitos"
            [attr.aria-invalid]="erroresPersona.ruc ? 'true' : null"
          />
          <small class="persona-error" *ngIf="erroresPersona.ruc">
            {{ erroresPersona.ruc }}
          </small>
        </label>

        <label class="campo persona-dni">
          <span class="persona-label">DNI</span>
          <input
            type="text"
            name="personaDni"
            [(ngModel)]="datosPersona.dni"
            maxlength="8"
            inputmode="numeric"
            placeholder="Ingrese 8 dígitos"
            [attr.aria-invalid]="erroresPersona.dni ? 'true' : null"
          />
          <small class="persona-error" *ngIf="erroresPersona.dni">
            {{ erroresPersona.dni }}
          </small>
        </label>

        <label class="campo persona-telefono">
          <span class="persona-label">TELÉFONO</span>
          <input
            type="tel"
            name="personaTelefono"
            [(ngModel)]="datosPersona.telefono"
            maxlength="25"
            autocomplete="tel"
            placeholder="Ingrese el teléfono"
          />
        </label>

        <label class="campo persona-domicilio">
          <span class="persona-label">DOMICILIO</span>
          <input
            type="text"
            name="personaDomicilio"
            [(ngModel)]="datosPersona.domicilio"
            maxlength="250"
            autocomplete="street-address"
            placeholder="Ingrese la dirección"
          />
        </label>

        <label class="campo persona-correo">
          <span class="persona-label">CORREO ELECTRÓNICO</span>
          <input
            type="email"
            name="personaCorreo"
            [(ngModel)]="datosPersona.correo"
            maxlength="254"
            autocomplete="email"
            placeholder="Ingrese el correo"
            [attr.aria-invalid]="erroresPersona.correo ? 'true' : null"
          />
          <small class="persona-error" *ngIf="erroresPersona.correo">
            {{ erroresPersona.correo }}
          </small>
        </label>
        <label class="campo persona-situacion">
          <span class="persona-label">SITUACIÓN DE LA PERSONA (opcional)</span>
          <select name="persona_situacion" [(ngModel)]="datosPersona.situacion">
            <option value="">Seleccione</option>
            <option>Oficial en actividad</option>
            <option>Oficial en retiro</option>
            <option>TCO y/o SOO en actividad</option>
            <option>TCO y/o SOO en retiro</option>
            <option>Personal civil del Ejército</option>
            <option>Personal civil ajeno al Ejército</option>
          </select>
        </label>
      </fieldset>
    </div>
  </section>
  <!-- ====================================== -->
  <!-- FILA 1 -->
  <!-- ====================================== -->

  <div class="form-grid grid-3">
    <!-- CATEGORÍA -->

    <div class="campo">
      <label> CATEGORÍA </label>

      <select [(ngModel)]="idTipoExpediente" (change)="cambiarTipoExpediente()">
        <option [ngValue]="null">Seleccione</option>

        <option
          *ngFor="let tipo of tiposExpediente"
          [ngValue]="tipo.idTipoExpediente"
        >
          {{ tipo.nombre }}
        </option>
      </select>
    </div>

    <!-- TIPO DOCUMENTO -->

    <div class="campo">
      <label> TIPO DE DOC </label>

      <select [(ngModel)]="idTipoDocumento" (change)="cambiarTipoDocumento()">
        <option [ngValue]="null">Seleccione</option>

        <option
          *ngFor="let tipo of tiposDocumento"
          [ngValue]="tipo.idTipoDocumento"
        >
          {{ tipo.nombre }}
        </option>
      </select>
    </div>

    <!-- OTROS -->

    <div class="campo campo-otro" *ngIf="esTipoDocumentoOtros()">
      <label> ESPECIFIQUE TIPO DE DOCUMENTO </label>

      <input
        type="text"
        [(ngModel)]="otroTipoDocumento"
        maxlength="150"
        placeholder="Ej. Memorándum, Parte, Acta..."
      />
    </div>
  </div>

  <!-- ====================================== -->
  <!-- FILA 2 -->
  <!-- ====================================== -->

  <div class="form-grid grid-3">
    <div class="campo">
      <label> N° DOC </label>

      <input
        type="text"
        [(ngModel)]="nroDocumento"
        placeholder="N° documento"
      />
    </div>

    <div class="campo">
      <label> FECHA </label>

      <input type="date" [(ngModel)]="fechaDocumento" />
    </div>

    <div class="campo">
      <label> TIPIFICACIÓN </label>

      <select [(ngModel)]="idTipificacion">
        <option [ngValue]="null">Seleccione</option>

        <option
          *ngFor="let tip of tipificaciones"
          [ngValue]="tip.idTipificacion"
        >
          {{ tip.nombre }}
        </option>
      </select>
    </div>
  </div>

  <!-- ====================================== -->
  <!-- UBICACIÓN -->
  <!-- ====================================== -->

  <div class="form-grid grid-3">
    <!-- NÚCLEO -->

    <div class="campo">
      <label> NÚCLEO </label>

      <select [(ngModel)]="idNucleo" (change)="cambiarNucleo()">
        <option [ngValue]="null">Seleccione</option>

        <option *ngFor="let nucleo of nucleos" [ngValue]="nucleo.idNucleo">
          {{ nucleo.nombre }}
        </option>
      </select>
    </div>

    <!-- GRAN UNIDAD -->

    <div class="campo">
      <label> GRAN UNIDAD </label>

      <select
        [(ngModel)]="idBrigada"
        (change)="cambiarBrigada()"
        [disabled]="!idNucleo"
      >
        <option [ngValue]="null">Seleccione</option>

        <option *ngFor="let brigada of brigadas" [ngValue]="brigada.idBrigada">
          {{ brigada.nombre }}
        </option>
      </select>
    </div>

    <!-- UNIDAD -->

    <div class="campo">
      <label> UNIDAD </label>

      <select
        [(ngModel)]="idUnidad"
        (change)="cambiarUnidad()"
        [disabled]="!idBrigada"
      >
        <option [ngValue]="null">Seleccione</option>

        <option *ngFor="let unidad of unidades" [ngValue]="unidad.idUnidad">
          {{ unidad.nombre }}
        </option>
      </select>
    </div>
  </div>

  <!-- ====================================== -->
  <!-- INSPECTORÍA -->
  <!-- SIN DESTINO -->
  <!-- ====================================== -->

  <div class="form-grid grid-2 inspector-grid">
    <!-- NÚCLEO IG -->

    <div class="campo">
      <label> NÚCLEO IG </label>

      <select [(ngModel)]="idNucleoIg" disabled>
        <option [ngValue]="null">Seleccione una unidad primero</option>

        <option *ngFor="let nucleo of nucleosIg" [ngValue]="+nucleo.idNucleo">
          {{ obtenerNombreNucleoIg(nucleo) }}
        </option>
      </select>
    </div>

    <!-- IG -->

    <div class="campo">
      <label> IG </label>

      <select
        [(ngModel)]="idIg"
        [disabled]="!idUnidad || brigadasIg.length === 0"
      >
        <option [ngValue]="null">Seleccione una unidad primero</option>

        <option
          *ngFor="let brigada of brigadasIg"
          [ngValue]="brigada.idBrigada"
        >
          {{ brigada.nombre }}
        </option>
      </select>
    </div>
  </div>

  <!-- ====================================== -->
  <!-- ASUNTO -->
  <!-- ====================================== -->

  <div class="campo campo-completo">
    <label> ASUNTO </label>

    <input type="text" [(ngModel)]="asunto" placeholder="Ingrese el asunto" />
  </div>

  <!-- ====================================== -->
  <!-- DESCRIPCIÓN -->
  <!-- ====================================== -->

  <div class="campo campo-completo">
    <label> DESCRIPCIÓN </label>

    <textarea
      rows="4"
      [(ngModel)]="descripcion"
      placeholder="Ingrese la descripción"
    >
    </textarea>
  </div>

  <!-- ====================================== -->
  <!-- PDFs -->
  <!-- ====================================== -->

  <div class="adjuntos">
    <div class="adjuntos-top">
      <div>
        <strong> DOCUMENTOS ADJUNTOS </strong>

        <small> Máximo 5 archivos PDF · 1 GB por archivo </small>
      </div>

      <div class="contador-pdf">{{ archivos.length }}/5</div>
    </div>

    <input
      #inputPdf
      type="file"
      class="input-archivo-registro-qr3"
      accept=".pdf,application/pdf"
      multiple
      (change)="seleccionarArchivos($event)"
    />

    <button
      type="button"
      class="btn-agregar-pdf"
      [disabled]="guardando || archivos.length >= 5"
      (click)="inputPdf.click()"
    >
      + AGREGAR PDF
    </button>

    <!-- PDFs -->

    <div class="lista-pdfs" *ngIf="archivos.length > 0">
      <div class="pdf-item" *ngFor="let archivo of archivos; let i = index">
        <div class="pdf-icono">PDF</div>

        <div class="pdf-info">
          <strong>
            {{ archivo.name }}
          </strong>

          <small>
            {{ formatearTamano(archivo.size) }}
          </small>
        </div>

        <button
          type="button"
          class="btn-quitar-pdf"
          [disabled]="guardando"
          (click)="quitarArchivo(i)"
        >
          ✕
        </button>
      </div>
    </div>
  </div>

  <!-- ====================================== -->
  <!-- ACCIONES -->
  <!-- ====================================== -->

  <div class="acciones">
    <button
      type="button"
      class="btn-cancelar"
      [disabled]="guardando"
      (click)="cancelar()"
    >
      CANCELAR
    </button>

    <button
      type="button"
      class="btn-guardar"
      [disabled]="guardando"
      (click)="guardar()"
    >
      {{ guardando ? "GUARDANDO..." : "GUARDAR" }}
    </button>
  </div>
</div>

<!-- ====================================== -->
<!-- ÉXITO -->
<!-- ====================================== -->

<div class="mensaje-overlay" *ngIf="mostrarExito">
  <div class="mensaje-exito">
    <div class="icono-exito">✓</div>

    <h2>Documento QRD Nivel 3 registrado</h2>

    <p>El expediente fue registrado correctamente.</p>

    <div class="cinv-generado">
      <span> CINV GENERADO </span>

      <strong>
        {{ cinvGenerado }}
      </strong>
    </div>

    <button type="button" class="btn-aceptar-exito" (click)="cerrarExito()">
      ACEPTAR
    </button>
  </div>
</div>
