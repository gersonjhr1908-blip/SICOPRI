<div class="nuevo-documento-page">


  <!-- ====================================== -->
  <!-- FILA 1 -->
  <!-- ====================================== -->

  <div class="form-grid grid-3">


    <!-- CATEGORÍA -->

    <div class="campo">

      <label>
        CATEGORÍA
      </label>


      <select
        [(ngModel)]="idTipoExpediente"
        (change)="cambiarTipoExpediente()">


        <option [ngValue]="null">
          Seleccione
        </option>


        <option
          *ngFor="
            let tipo
            of tiposExpediente
          "
          [ngValue]="
            tipo.idTipoExpediente
          ">

          {{ tipo.nombre }}

        </option>

      </select>

    </div>


    <!-- TIPO DOCUMENTO -->

    <div class="campo">

      <label>
        TIPO DE DOC
      </label>


      <select
        [(ngModel)]="idTipoDocumento"
        (change)="cambiarTipoDocumento()">


        <option [ngValue]="null">
          Seleccione
        </option>


        <option
          *ngFor="
            let tipo
            of tiposDocumento
          "
          [ngValue]="
            tipo.idTipoDocumento
          ">

          {{ tipo.nombre }}

        </option>

      </select>

    </div>


    <!-- OTROS -->

    <div
      class="campo campo-otro"
      *ngIf="
        esTipoDocumentoOtros()
      ">

      <label>
        ESPECIFIQUE TIPO DE DOCUMENTO
      </label>


      <input
        type="text"
        [(ngModel)]="otroTipoDocumento"
        maxlength="150"
        placeholder="Ej. Memorándum, Parte, Acta..."
      />

    </div>

  </div>


  <!-- ====================================== -->
  <!-- FILA 2 -->
  <!-- ====================================== -->

  <div class="form-grid grid-3">


    <div class="campo">

      <label>
        N° DOC
      </label>


      <input
        type="text"
        [(ngModel)]="nroDocumento"
        placeholder="N° documento"
      />

    </div>


    <div class="campo">

      <label>
        FECHA
      </label>


      <input
        type="date"
        [(ngModel)]="fechaDocumento"
      />

    </div>


    <div class="campo">

      <label>
        TIPIFICACIÓN
      </label>


      <select
        [(ngModel)]="idTipificacion">


        <option [ngValue]="null">
          Seleccione
        </option>


        <option
          *ngFor="
            let tip
            of tipificaciones
          "
          [ngValue]="
            tip.idTipificacion
          ">

          {{ tip.nombre }}

        </option>

      </select>

    </div>

  </div>


  <!-- ====================================== -->
  <!-- UBICACIÓN -->
  <!-- ====================================== -->

  <div class="form-grid grid-3">


    <!-- NÚCLEO -->

    <div class="campo">

      <label>
        NÚCLEO
      </label>


      <select
        [(ngModel)]="idNucleo"
        (change)="cambiarNucleo()">


        <option [ngValue]="null">
          Seleccione
        </option>


        <option
          *ngFor="
            let nucleo
            of nucleos
          "
          [ngValue]="
            nucleo.idNucleo
          ">

          {{ nucleo.nombre }}

        </option>

      </select>

    </div>


    <!-- GRAN UNIDAD -->

    <div class="campo">

      <label>
        GRAN UNIDAD
      </label>


      <select
        [(ngModel)]="idBrigada"
        (change)="cambiarBrigada()"
        [disabled]="!idNucleo">


        <option [ngValue]="null">
          Seleccione
        </option>


        <option
          *ngFor="
            let brigada
            of brigadas
          "
          [ngValue]="
            brigada.idBrigada
          ">

          {{ brigada.nombre }}

        </option>

      </select>

    </div>


    <!-- UNIDAD -->

    <div class="campo">

      <label>
        UNIDAD
      </label>


      <select
        [(ngModel)]="idUnidad"
        (change)="cambiarUnidad()"
        [disabled]="!idBrigada">


        <option [ngValue]="null">
          Seleccione
        </option>


        <option
          *ngFor="
            let unidad
            of unidades
          "
          [ngValue]="
            unidad.idUnidad
          ">

          {{ unidad.nombre }}

        </option>

      </select>

    </div>

  </div>


  <!-- ====================================== -->
  <!-- INSPECTORÍA -->
  <!-- SIN DESTINO -->
  <!-- ====================================== -->

  <div class="form-grid grid-2 inspector-grid">


    <!-- NÚCLEO IG -->

    <div class="campo">

      <label>
        NÚCLEO IG
      </label>


      <select
        [(ngModel)]="idNucleoIg"
        disabled>


        <option [ngValue]="null">
          Seleccione una unidad primero
        </option>


        <option
          *ngFor="
            let nucleo
            of nucleosIg
          "
          [ngValue]="
            +nucleo.idNucleo
          ">

          {{
            obtenerNombreNucleoIg(
              nucleo
            )
          }}

        </option>

      </select>

    </div>


    <!-- IG -->

    <div class="campo">

      <label>
        IG
      </label>


      <select
        [(ngModel)]="idIg"
        disabled>


        <option [ngValue]="null">
          Seleccione una unidad primero
        </option>


        <option
          *ngFor="
            let brigada
            of brigadasIg
          "
          [ngValue]="
            brigada.idBrigada
          ">

          {{ brigada.nombre }}

        </option>

      </select>

    </div>

  </div>


  <!-- ====================================== -->
  <!-- ASUNTO -->
  <!-- ====================================== -->

  <div class="campo campo-completo">

    <label>
      ASUNTO
    </label>


    <input
      type="text"
      [(ngModel)]="asunto"
      placeholder="Ingrese el asunto"
    />

  </div>


  <!-- ====================================== -->
  <!-- DESCRIPCIÓN -->
  <!-- ====================================== -->

  <div class="campo campo-completo">

    <label>
      DESCRIPCIÓN
    </label>


    <textarea
      rows="4"
      [(ngModel)]="descripcion"
      placeholder="Ingrese la descripción">
    </textarea>

  </div>


  <!-- ====================================== -->
  <!-- PDFs -->
  <!-- ====================================== -->

  <div class="adjuntos">


    <div class="adjuntos-top">


      <div>

        <strong>
          DOCUMENTOS ADJUNTOS
        </strong>


        <small>
          Máximo 5 archivos PDF · 10 MB por archivo
        </small>

      </div>


      <div class="contador-pdf">

        {{ archivos.length }}/5

      </div>

    </div>


    <input
      #inputPdf
      type="file"
      class="input-archivo-registro-qr3"
      accept=".pdf,application/pdf"
      multiple
      (change)="seleccionarArchivos($event)"
    />


    <button
      type="button"
      class="btn-agregar-pdf"
      [disabled]="
        guardando ||
        archivos.length >= 5
      "
      (click)="inputPdf.click()">

      + AGREGAR PDF

    </button>


    <!-- PDFs -->

    <div
      class="lista-pdfs"
      *ngIf="
        archivos.length > 0
      ">


      <div
        class="pdf-item"
        *ngFor="
          let archivo
          of archivos;
          let i = index
        ">


        <div class="pdf-icono">
          PDF
        </div>


        <div class="pdf-info">

          <strong>
            {{ archivo.name }}
          </strong>


          <small>
            {{ formatearTamano(archivo.size) }}
          </small>

        </div>


        <button
          type="button"
          class="btn-quitar-pdf"
          [disabled]="guardando"
          (click)="quitarArchivo(i)">

          ✕

        </button>

      </div>

    </div>

  </div>


  <!-- ====================================== -->
  <!-- ACCIONES -->
  <!-- ====================================== -->

  <div class="acciones">


    <button
      type="button"
      class="btn-cancelar"
      [disabled]="guardando"
      (click)="cancelar()">

      CANCELAR

    </button>


    <button
      type="button"
      class="btn-guardar"
      [disabled]="guardando"
      (click)="guardar()">

      {{
        guardando
          ? 'GUARDANDO...'
          : 'GUARDAR'
      }}

    </button>

  </div>

</div>


<!-- ====================================== -->
<!-- ÉXITO -->
<!-- ====================================== -->

<div
  class="mensaje-overlay"
  *ngIf="mostrarExito">


  <div class="mensaje-exito">


    <div class="icono-exito">
      ✓
    </div>


    <h2>
      Documento QRD Nivel 3 registrado
    </h2>


    <p>
      El expediente fue registrado correctamente.
    </p>


    <div class="cinv-generado">

      <span>
        CINV GENERADO
      </span>


      <strong>
        {{ cinvGenerado }}
      </strong>

    </div>


    <button
      type="button"
      class="btn-aceptar-exito"
      (click)="cerrarExito()">

      ACEPTAR

    </button>

  </div>

</div>
