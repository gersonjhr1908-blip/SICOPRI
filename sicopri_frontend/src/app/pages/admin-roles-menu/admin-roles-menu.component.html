<div fxLayout="column" class="roles-page"
  style="display: flex; align-items: center; background-image: url('assets/fond.jpg'); background-size: cover;">
  <mat-card class="custom-card" style="margin-top: 10px;">
    <mat-card-header style="display: flex; justify-content: center;">
      <mat-card-title class="custom-card-title">ADMINISTRACIÓN DE ROLES Y MENÚS</mat-card-title>
    </mat-card-header>
    <br>
    <div class="mat-elevation-z8 demo-table">
      <div class="toolbar-row">
        <mat-form-field appearance="outline" class="custom-search-width">
          <mat-label>Buscador</mat-label>
          <mat-icon matSuffix>search</mat-icon>
          <input matInput [(ngModel)]="buscador" (input)="aplicarFiltro()"
            placeholder="ID, nombre, descripción...">
        </mat-form-field>
        <div class="toolbar-actions">
          <button mat-raised-button class="button-total" matTooltip="Total de roles">
            <mat-icon>badge</mat-icon> Total: {{ totalRoles }}
          </button>
          <button mat-raised-button class="button-nueva-cuenta" matTooltip="Nuevo rol" (click)="openNuevoRol()">
            <mat-icon>add</mat-icon> Nuevo rol
          </button>
        </div>
      </div>

      <div *ngIf="cargando" class="loading-table">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div class="table-scroll-area" *ngIf="!cargando">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="idRole">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let row">{{ row.idRole }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
          <td mat-cell *matCellDef="let row">{{ row.description }}</td>
        </ng-container>

        <ng-container matColumnDef="menus">
          <th mat-header-cell *matHeaderCellDef>Menús</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" matTooltip="Asignar menús"
              (click)="openMenusRol(row)">
              <mat-icon>menu</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="userCount">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuarios</th>
          <td mat-cell *matCellDef="let row">
            <span class="badge-usuarios">{{ row.userCount ?? 0 }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="col-acciones-header">Acciones</th>
          <td mat-cell *matCellDef="let row" class="col-acciones">
            <div class="acciones-fila">
              <button mat-icon-button color="accent" matTooltip="Editar" (click)="openEditarRol(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminarRol(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">Sin roles registrados</td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[ 10, 25]" showFirstLastButtons></mat-paginator>
      </div>
    </div>
  </mat-card>
</div>
