<section class="manual-page">
  <div class="manual-card">

    <header class="manual-cabecera">
      <div class="manual-identidad">
        <div class="manual-icono" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 5.5C9 3.5 5.5 3.5 2 5v15c3.5-1.5 7-1.5 10 .5
                 3-2 6.5-2 10-.5V5c-3.5-1.5-7-1.5-10 .5Z"
            />
            <path d="M12 5.5v15" />
          </svg>
        </div>

        <div>
          <h1>{{ titulo }}</h1>

          <p>{{ departamento }}</p>
        </div>
      </div>

      <a
        class="btn-descargar"
        [href]="rutaPdf"
        [download]="nombreArchivo"
      >
        <span aria-hidden="true">↓</span>
        Descargar PDF
      </a>
    </header>

    <div class="manual-indicacion">
      Consulta la guía de uso y las opciones disponibles para tu nivel.
      Puedes imprimirla desde la barra del visor PDF.
    </div>

    <div class="manual-visor">
      <iframe
        *ngIf="pdfUrl"
        [src]="pdfUrl"
        [title]="titulo"
      ></iframe>
    </div>

    <footer class="manual-pie">
      <span> SICOPRI · Ejército del Perú </span>

      <a
        [href]="rutaPdf"
        target="_blank"
        rel="noopener noreferrer"
      >
        ¿No se muestra el documento? Abrir PDF
      </a>
    </footer>

  </div>
</section>
